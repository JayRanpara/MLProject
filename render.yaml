services:
  - type: web
    name: cardiosight-backend
    env: python
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_PATH
        value: /var/data/cardio.db
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
